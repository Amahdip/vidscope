<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidscope</title>
<meta name="description" content="See the bytes inside video files: an interactive anatomy viewer for MP4/MOV, Matroska/WebM, MPEG-TS, AVI and FLV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0.75' y='0.75' width='62.5' height='62.5' rx='13.5' fill='%230b0f14' stroke='%232a3542' stroke-width='1.5'/%3E%3Cg fill='none' stroke='%23e6edf3' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 21V12h9'/%3E%3Cpath d='M43 12h9v9'/%3E%3Cpath d='M12 43v9h9'/%3E%3Cpath d='M52 43v9h-9'/%3E%3C/g%3E%3Crect x='19' y='20' width='7' height='24' rx='2' fill='%235ee0a0'/%3E%3Crect x='29' y='20' width='16' height='10.5' rx='2' fill='%2358a6ff'/%3E%3Crect x='29' y='33.5' width='16' height='10.5' rx='2' fill='%23b28cf5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app" class="app">
  <header class="topbar" id="topbar"></header>
  <section class="mapbar" id="mapbar"></section>
  <main class="panes" id="panes">
    <aside class="pane left" id="left"></aside>
    <section class="pane center" id="center"></section>
    <aside class="pane right" id="right"></aside>
  </main>
  <section class="welcome" id="welcome" hidden></section>
  <section class="compare" id="compare" hidden></section>
  <section class="compare report" id="report" hidden></section>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="drop-overlay" id="drop" hidden><div>Drop to open<span>parsed locally in your browser; nothing is uploaded</span></div></div>
<input type="file" id="filepick" multiple hidden>
<noscript>Vidscope needs JavaScript.</noscript>
</body>
</html>
