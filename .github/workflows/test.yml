name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests compare what Vidscope reads with FFmpeg's own demuxers, and build their
      # fixtures with FFmpeg's encoders.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg version
        run: ffmpeg -hide_banner -version | head -1
      - name: Make the sample files
        run: npm run samples
      - name: Test
        run: npm test
